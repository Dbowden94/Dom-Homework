<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crochet Project Planner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <h1>🧶 Crochet Project Planner</h1>
        <p id="welcomeMessage">Plan your next crochet project!</p>

        <button id="messageButton">Get Inspired</button>

        <section class="planner">
            <label for="projectInput">Project name:</label>
            <input type="text" id="projectInput" placeholder="Type a crochet project...">

            <button id="addButton">Add Project</button>

            <h2>My Project List</h2>
            <ul id="projectList"></ul>
        </section>
    </main>

    <script src="script.js"></script>
</body>

</html>
